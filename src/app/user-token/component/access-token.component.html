<div class="access-token">
  <div [ngbTooltip]="'token.tooltip' | translate">
    <span class="token-label">{{ 'token.label' | translate }}</span>
    <span class="token-value">{{ accessToken }}</span>
  </div>
  <button class="copy-btn" [class.copied]="copied" [title]="'token.copy' | translate" (click)="copyToken()" [ngbTooltip]="'token.copy' | translate">
    @if (copied) {
      <i class="fa-solid fa-check"></i>
    } @else {
      <i class="fa-regular fa-copy"></i>
    }
  </button>
  <button class="icon-btn" [class.active]="showInput" [title]="'token.switchToken' | translate" (click)="toggleInput()" [ngbTooltip]="'token.switchToken' | translate">
    <i class="fa-solid fa-arrows-rotate"></i>
  </button>
  <button class="icon-btn danger" [class.active]="showConfirm" [title]="'token.removeToken' | translate" (click)="eraseToken()" [ngbTooltip]="'token.removeToken' | translate">
    <i class="fa-solid fa-trash"></i>
  </button>
</div>
@if (showConfirm) {
  <div class="confirm-row">
    <span class="confirm-text">{{ 'token.removeConfirm' | translate }}</span>
    <button class="confirm-btn" (click)="confirmErase()">{{ 'token.remove' | translate }}</button>
    <button class="cancel-btn" (click)="cancelErase()">{{ 'token.cancel' | translate }}</button>
  </div>
}
@if (showInput) {
  <div class="token-input-row">
    <input
      class="token-input"
      type="text"
      [placeholder]="'token.placeholder' | translate"
      [(ngModel)]="inputToken"
      (keyup.enter)="submitToken()"
      [disabled]="validating"
      autocomplete="off"
    />
    <button class="apply-btn" (click)="submitToken()" [disabled]="validating || !inputToken.trim()">
      @if (validating) {
        <span class="spinner"></span>
      } @else {
        {{ 'token.apply' | translate }}
      }
    </button>
  </div>
  @if (tokenError) {
    <span class="token-error">{{ tokenError | translate }}</span>
  }
}

<div class="access-token">
  <div ngbTooltip="This is your personal token, you can use it to track your expenses in different devices, just copy paste and save in a notepad!">
    <span class="token-label">Your access token</span>
    <span class="token-value">{{ accessToken }}</span>
  </div>
    <button class="copy-btn" [class.copied]="copied" title="Copy token" (click)="copyToken()" ngbTooltip="Copy to clipboard">
    @if (copied) {
      <i class="fa-solid fa-check"></i>
    } @else {
      <i class="fa-regular fa-copy"></i>
    }
  </button>
  <button class="icon-btn" [class.active]="showInput" title="Use a different token" (click)="toggleInput()"  ngbTooltip="Use a different token">
    <i class="fa-solid fa-arrows-rotate"></i>
  </button>
</div>
@if (showInput) {
  <div class="token-input-row">
    <input
      class="token-input"
      type="text"
      placeholder="e.g. XXXX-XXXX-XXXX"
      [(ngModel)]="inputToken"
      (keyup.enter)="submitToken()"
      [disabled]="validating"
      autocomplete="off"
    />
    <button class="apply-btn" (click)="submitToken()" [disabled]="validating || !inputToken.trim()">
      @if (validating) {
        <span class="spinner"></span>
      } @else {
        Apply
      }
    </button>
  </div>
  @if (tokenError) {
    <span class="token-error">{{ tokenError }}</span>
  }
}

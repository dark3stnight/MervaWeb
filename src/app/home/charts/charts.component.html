<div class="charts-row">
  <!-- Line chart -->
  <div class="card chart-card">
    <div class="chart-header">
      <span class="chart-title">Expenses over time</span>
      <button class="period-btn">This month ▾</button>
    </div>
    <svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" class="line-chart-svg">
      <defs>
        <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.01"/>
        </linearGradient>
      </defs>
      <!-- Grid lines -->
      <line x1="50" y1="20"  x2="490" y2="20"  stroke="#E5E7EB" stroke-width="1"/>
      <line x1="50" y1="55"  x2="490" y2="55"  stroke="#E5E7EB" stroke-width="1"/>
      <line x1="50" y1="90"  x2="490" y2="90"  stroke="#E5E7EB" stroke-width="1"/>
      <line x1="50" y1="125" x2="490" y2="125" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="50" y1="160" x2="490" y2="160" stroke="#E5E7EB" stroke-width="1"/>
      <!-- Y axis labels -->
      <text x="44" y="24"  text-anchor="end" fill="#9CA3AF" font-size="10">$100</text>
      <text x="44" y="59"  text-anchor="end" fill="#9CA3AF" font-size="10">$75</text>
      <text x="44" y="94"  text-anchor="end" fill="#9CA3AF" font-size="10">$50</text>
      <text x="44" y="129" text-anchor="end" fill="#9CA3AF" font-size="10">$25</text>
      <text x="44" y="164" text-anchor="end" fill="#9CA3AF" font-size="10">$0</text>
      <!-- X axis labels -->
      <text x="50"  y="178" text-anchor="middle" fill="#9CA3AF" font-size="10">May 1</text>
      <text x="165" y="178" text-anchor="middle" fill="#9CA3AF" font-size="10">May 8</text>
      <text x="265" y="178" text-anchor="middle" fill="#9CA3AF" font-size="10">May 15</text>
      <text x="370" y="178" text-anchor="middle" fill="#9CA3AF" font-size="10">May 22</text>
      <text x="480" y="178" text-anchor="middle" fill="#9CA3AF" font-size="10">May 31</text>
      <!-- Area fill -->
      <polygon [attr.points]="areaPoints" fill="url(#areaGradient)"/>
      <!-- Line -->
      <polyline [attr.points]="linePoints" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Highlight point -->
      <circle cx="251" cy="72" r="4" fill="#7C3AED"/>
      <circle cx="251" cy="72" r="7" fill="#7C3AED" fill-opacity="0.15"/>
      <!-- Tooltip -->
      <rect x="210" y="38" width="82" height="28" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="251" y="50" text-anchor="middle" fill="#6B7280" font-size="9">May 15</text>
      <text x="251" y="62" text-anchor="middle" fill="#111827" font-size="10" font-weight="600">$63.40</text>
      <!-- Tooltip vertical line -->
      <line x1="251" y1="66" x2="251" y2="72" stroke="#7C3AED" stroke-width="1" stroke-dasharray="2 2"/>
    </svg>
  </div>

  <!-- Donut chart -->
  <div class="card chart-card">
    <div class="chart-header">
      <span class="chart-title">Spending by category</span>
      <button class="period-btn">This month ▾</button>
    </div>
    <div class="donut-row">
      <svg viewBox="0 0 200 200" class="donut-svg">
        <circle cx="100" cy="100" r="65" fill="none" stroke="#F3F4F6" stroke-width="30"/>
        @for (seg of donutSegments; track seg.color) {
          <circle cx="100" cy="100" r="65" fill="none"
            [attr.stroke]="seg.color"
            stroke-width="30"
            [attr.stroke-dasharray]="seg.dash"
            [attr.transform]="'rotate(' + seg.rotate + ', 100, 100)'"/>
        }
        <text x="100" y="96" text-anchor="middle" fill="#111827" font-size="14" font-weight="700">$1,263.50</text>
        <text x="100" y="112" text-anchor="middle" fill="#9CA3AF" font-size="10">Total</text>
      </svg>
      <div class="legend">
        @for (cat of categories; track cat.name) {
          <div class="legend-item">
            <span class="legend-dot" [style.background]="cat.color"></span>
            <span class="legend-name">{{ cat.name }}</span>
            <span class="legend-pct">{{ cat.pct }}%</span>
            <span class="legend-amt">{{ cat.amount }}</span>
          </div>
        }
      </div>
    </div>
  </div>
</div>

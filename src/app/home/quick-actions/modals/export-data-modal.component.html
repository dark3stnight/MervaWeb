<div class="modal-header border-0 pb-1">
  <h5 class="modal-title d-flex align-items-center gap-2">
    <span class="d-inline-flex align-items-center justify-content-center rounded-2"
          style="width:34px;height:34px;background:#DBEAFE;flex-shrink:0">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </span>
    Export data
  </h5>
  <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
</div>

<div class="modal-body pt-2">
  @if (error) {
    <div class="alert alert-danger py-2 small mb-3">{{ error }}</div>
  }

  <div class="mb-3">
    <label class="form-label fw-semibold">Data to export</label>
    <select class="form-select" [(ngModel)]="dataType" [disabled]="exporting">
      <option value="all">Expenses &amp; Incomes</option>
      <option value="expenses">Expenses only</option>
      <option value="incomes">Incomes only</option>
    </select>
  </div>

  <div>
    <label class="form-label fw-semibold">Format</label>
    <div class="d-flex gap-3">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="format" id="formatCsv"
               value="csv" [(ngModel)]="format" [disabled]="exporting" />
        <label class="form-check-label" for="formatCsv">CSV</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="format" id="formatJson"
               value="json" [(ngModel)]="format" [disabled]="exporting" />
        <label class="form-check-label" for="formatJson">JSON</label>
      </div>
    </div>
  </div>
</div>

<div class="modal-footer border-0">
  <button type="button" class="btn btn-light" (click)="modal.dismiss()" [disabled]="exporting">
    Cancel
  </button>
  <button type="button" class="btn btn-primary" (click)="export()" [disabled]="exporting">
    {{ exporting ? 'Exporting…' : 'Export' }}
  </button>
</div>

<div class="card">
  <span class="section-title">{{ 'actions.title' | translate }}</span>
  <div class="actions-grid">
    <button class="action-btn" (click)="openAddIncome()">
      <div class="action-icon green">
        <i class="fa-solid fa-circle-plus" style="color:#10B981"></i>
      </div>
      <span>{{ 'actions.addIncome' | translate }}</span>
    </button>
    <button class="action-btn" (click)="openManageTransactions()">
      <div class="action-icon teal">
        <i class="fa-solid fa-list" style="color:#14B8A6"></i>
      </div>
      <span>{{ 'actions.manageTransactions' | translate }}</span>
    </button>
  </div>
</div>

<div class="stats-grid">
  @for (stat of stats; track stat.label) {
    <div class="card stat-card">
      <div class="stat-top">
        <span class="stat-label">{{ stat.label }}</span>
        <div class="stat-icon" [class]="'stat-icon--' + stat.colorClass">
          @if (stat.colorClass === 'purple') {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          } @else if (stat.colorClass === 'green') {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          } @else if (stat.colorClass === 'blue') {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"/><path d="M12 6v6l4 2"/></svg>
          } @else {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          }
        </div>
      </div>
      <div class="stat-value">{{ stat.value }}</div>
      <div class="stat-change" [class.up]="stat.up" [class.down]="!stat.up">
        {{ stat.up ? '↑' : '↓' }} {{ stat.change }}
      </div>
    </div>
  }
</div>

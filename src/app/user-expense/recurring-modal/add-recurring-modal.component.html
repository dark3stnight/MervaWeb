<div class="modal-header border-0 pb-1">
  <h5 class="modal-title d-flex align-items-center gap-2">
    <span class="d-inline-flex align-items-center justify-content-center rounded-2"
          style="width:34px;height:34px;background:#EDE9FE;flex-shrink:0">
      <i class="fa-solid fa-arrows-rotate" style="color:#7C3AED"></i>
    </span>
    Add recurring expense
  </h5>
  <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
</div>

<div class="modal-body pt-2">
  <div class="alert alert-secondary py-2 small mb-3 d-flex align-items-center gap-2">
    <i class="fa-solid fa-circle-info" style="flex-shrink:0"></i>
    Recurring expenses are coming soon — fill in your details and they will be saved when this feature launches.
  </div>

  <div class="mb-3">
    <label class="form-label fw-semibold">Name</label>
    <input type="text" class="form-control" placeholder="e.g. Netflix, Gym membership…" [(ngModel)]="name" />
  </div>

  <div class="row g-2 mb-3">
    <div class="col-8">
      <label class="form-label fw-semibold">Amount</label>
      <input type="number" class="form-control" placeholder="0.00" [(ngModel)]="amount" min="0" step="0.01" />
    </div>
    <div class="col-4">
      <label class="form-label fw-semibold">Currency</label>
      <select class="form-select" [(ngModel)]="currency">
        @for (c of currencies; track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label fw-semibold">
      Category <span class="text-muted fw-normal">(optional)</span>
    </label>
    <select class="form-select" [(ngModel)]="category">
      <option value="">None</option>
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label fw-semibold">Frequency</label>
    <select class="form-select" [(ngModel)]="frequency">
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
      <option value="yearly">Yearly</option>
    </select>
  </div>

  <div class="row g-2">
    <div class="col-6">
      <label class="form-label fw-semibold">Start date</label>
      <input type="date" class="form-control" [(ngModel)]="startDate" />
    </div>
    <div class="col-6">
      <label class="form-label fw-semibold">
        End date <span class="text-muted fw-normal">(optional)</span>
      </label>
      <input type="date" class="form-control" [(ngModel)]="endDate" />
    </div>
  </div>
</div>

<div class="modal-footer border-0">
  <button type="button" class="btn btn-light" (click)="modal.dismiss()">Cancel</button>
  <button type="button" class="btn btn-primary" (click)="modal.close()"
          [disabled]="!name.trim() || !amount">
    Save recurring
  </button>
</div>

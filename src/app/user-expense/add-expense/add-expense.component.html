<div class="add-expense-header">
  <span class="add-expense-title">
    <i class="fa-solid fa-plus" style="color:#7C3AED"></i>
    {{ 'expense.title' | translate }}
  </span>
  <span class="add-expense-hint">
    <i class="fa-solid fa-bolt" style="color:#7C3AED"></i>
    {{ 'expense.hint' | translate }}
  </span>
</div>
<div class="add-expense-form">
  <div class="input-wrap">
    <i class="fa-solid fa-credit-card" style="color:#9CA3AF"></i>
    <input type="text" [placeholder]="'expense.namePlaceholder' | translate" [(ngModel)]="name" [disabled]="submitting" />
  </div>
    <input
    type="date"
    class="date-input"
    [(ngModel)]="expenseDate"
    [disabled]="submitting"
  />
    <input
    type="text"
    class="category-input"
    [(ngModel)]="category"
    [ngbTypeahead]="searchCategory"
    [inputFormatter]="categoryInputFormatter"
    [resultFormatter]="categoryResultFormatter"
    container="body"
    (focus)="categoryFocus$.next($any($event).target.value)"
    (click)="categoryClick$.next($any($event).target.value)"
    #categoryTypeahead="ngbTypeahead"
    [placeholder]="'expense.categoryPlaceholder' | translate"
    autocomplete="off"
    [disabled]="submitting"
  />
  <input
    type="number"
    class="amount-input"
    placeholder="4.00"
    [(ngModel)]="amount"
    [disabled]="submitting"
  />
  <div class="currency-wrap">
    <input
      type="text"
      class="currency-input"
      [(ngModel)]="currency"
      [ngbTypeahead]="searchCurrency"
      container="body"
      (focus)="currencyFocus$.next($any($event).target.value); $any($event).target.select()"
      (click)="currencyClick$.next($any($event).target.value)"
      #currencyTypeahead="ngbTypeahead"
      placeholder="USD"
      autocomplete="off"
      [disabled]="submitting"
    />
    <button
      class="favorite-currency-star"
      [class.active]="favoriteCurrency"
      (click)="onFavoriteCurrencyChange(!favoriteCurrency)"
      [disabled]="submitting"
      type="button"
      [title]="'expense.currencyFavorite' | translate"
    >
      <i class="fa-solid fa-star"></i>
    </button>
  </div>
  <button class="add-btn" (click)="submit()" [disabled]="submitting || !name.trim() || !amount">
    {{ (submitting ? 'expense.adding' : 'expense.add') | translate }}
  </button>
</div>
@if (error) {
  <p class="expense-error">{{ error | translate }}</p>
}
